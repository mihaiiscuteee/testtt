name: Auto Commit Every 12 Hours

on:
  schedule:
    - cron: "0 */12 * * *"  # Toutes les 12 heures
  workflow_dispatch:  # Déclenchement manuel
  push:               # Ajout pour déclencher un run sur chaque commit poussé
    branches:
      - main          # Remplace par ta branche si ce n'est pas "main"

jobs:
  update_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Git User
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Make Unique Changes
        run: |
          echo "Mise à jour unique : $(date +'%Y-%m-%d %H:%M:%S')" > update_$(date +'%Y%m%d%H%M%S').txt
          git add .
          git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "Rien à valider"

      - name: Push Changes
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push || echo "Pas de changement à pousser"
